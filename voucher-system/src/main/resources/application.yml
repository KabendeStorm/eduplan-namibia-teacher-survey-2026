server:
  port: 8080

spring:
  application:
    name: wifi-voucher-system
  datasource:
    url: jdbc:h2:mem:voucherdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

voucher:
  # how often the scheduler scans for expired sessions
  expiry-scan-interval-ms: 5000
